# Example manifest for the OpenTelemetry Collector Builder (ocb):
#   go install go.opentelemetry.io/collector/cmd/builder@v0.153.0
#   builder --config otel_collector/builder-config.yaml
#
# This proves sentryexporter is a real, pluggable OTel Collector component —
# not something that only works inside this repo's own custom main.go binary.
# It assembles a distribution from official upstream components (the same
# receivers demo mode uses, plus the stock debugexporter) and sentryexporter,
# side by side, the same way you'd add it to your own collector build.
#
# sentryexporter isn't tagged/published yet, so the `replaces` entry below
# points at the local checkout instead of a real module version. Once a
# release is tagged, drop `replaces` and pin the exporter's `gomod` line to
# that version — everything else here stays the same.
dist:
  name: otelcol-sentry-custom
  description: Example OTel Collector distribution including sentryexporter
  output_path: ./dist

receivers:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/hostmetricsreceiver v0.153.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/receiver/dockerstatsreceiver v0.153.0

exporters:
  - gomod: github.com/thinkocapo/infrastructure/otel_collector/sentryexporter v0.0.0
  - gomod: go.opentelemetry.io/collector/exporter/debugexporter v0.153.0

replaces:
  - github.com/thinkocapo/infrastructure/otel_collector/sentryexporter => ../sentryexporter
