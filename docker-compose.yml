services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: demo
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"

  infra-monitor:
    build: .
    env_file: .env
    environment:
      COLLECTORS: docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - nginx
